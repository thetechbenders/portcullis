name: Go checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Race
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Vet lab build tag
        run: go vet -tags netnslab ./...
      - name: Formatting
        run: |
          gofmt -d .
          test -z "$(gofmt -l .)"
      - name: Python relay unit tests
        run: python3 -m unittest discover -s demo -p 'test_*.py' -v
      - name: Script syntax
        run: |
          for f in tests/netns/run.sh tests/netns/e2e.sh demo/portcullis-lab.sh; do bash -n "$f"; done
          sh -n tests/netns/udhcpc.script
          python3 -m py_compile tests/netns/*.py demo/nsproxy.py
  netns:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install isolated lab prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables iproute2 iputils-ping
      - name: Compile policy renderers
        run: |
          go build -o "${{ runner.temp }}/portcullis-policy" ./cmd/portcullis-policy
          go build -o "${{ runner.temp }}/portcullis-verify" ./cmd/portcullis-verify
          go build -tags netnslab -o "${{ runner.temp }}/portcullis-netnslab-policy" ./tests/netns/policy
          go test -tags netnslab ./internal/enforce
      - name: Namespace packet integration tests
        run: sudo bash tests/netns/run.sh "${{ runner.temp }}/portcullis-policy" "${{ runner.temp }}/portcullis-netnslab-policy" "${{ runner.temp }}/portcullis-verify"

  e2e:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install disposable namespace prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables iproute2 iputils-ping conntrack busybox curl
      - name: Compile Formnext processes
        run: |
          mkdir -p "${{ runner.temp }}/formnext-bin"
          for cmd in portcullisd portcullis-portal portcullisctl; do
            go build -o "${{ runner.temp }}/formnext-bin/$cmd" "./cmd/$cmd"
          done
      - name: Formnext kernel end-to-end tests
        run: sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted bash tests/netns/e2e.sh "${{ runner.temp }}/formnext-bin"
      - name: Disposable demo launcher lifecycle
        run: |
          trap 'sudo bash demo/portcullis-lab.sh down' EXIT
          sudo bash demo/portcullis-lab.sh up "${{ runner.temp }}/formnext-bin"
          sudo bash demo/portcullis-lab.sh status
          if sudo bash demo/portcullis-lab.sh restart; then
            echo "danger: live-controller restart succeeded" >&2
            exit 1
          fi
          sudo bash demo/portcullis-lab.sh down
          trap - EXIT
