# Temporary formatting helper scoped to this branch; delete after one pass.
name: One-off Portcullis host plan gofmt
on:
  push:
    branches:
      - feat/pi5-readonly-host-preflight-2026-11-05
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format only preflight code
        run: |
          set -euo pipefail
          gofmt -w internal/hostpreflight/*.go cmd/portcullis-host/main.go
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- internal/hostpreflight cmd/portcullis-host/main.go
            git commit -m 'Format pinned host plan and preflight tests'
            git push origin HEAD:refs/heads/feat/pi5-readonly-host-preflight-2026-11-05
          fi
