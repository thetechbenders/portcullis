# Temporary, branch-scoped formatter for the draft ARM64 preflight PR.
# Remove this workflow after it has formatted the new Go files.
name: One-off Portcullis Pi preflight gofmt

on:
  push:
    branches:
      - feat/pi5-readonly-host-preflight-2026-11-05

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format only the new preflight files
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/hostpreflight/hostpreflight.go internal/hostpreflight/hostpreflight_test.go cmd/portcullis-host/main.go
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- internal/hostpreflight/hostpreflight.go internal/hostpreflight/hostpreflight_test.go cmd/portcullis-host/main.go
            git commit -m 'Format Pi 5 host preflight Go sources'
            git push origin HEAD:refs/heads/feat/pi5-readonly-host-preflight-2026-11-05
          fi
